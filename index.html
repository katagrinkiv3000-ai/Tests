<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Тести</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card-hover: #20242e;
      --text: #f3f4f6;
      --muted: #8b92a5;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --accent-text: #ffffff;
      --ok: #10b981;
      --ok-soft: rgba(16, 185, 129, 0.16);
      --err: #ef4444;
      --err-soft: rgba(239, 68, 68, 0.16);
      --star: #f59e0b;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    body.light {
      --bg: #f2f4f8;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --accent-text: #ffffff;
      --ok: #059669;
      --ok-soft: rgba(5, 150, 105, 0.12);
      --err: #dc2626;
      --err-soft: rgba(220, 38, 38, 0.12);
      --star: #d97706;
      --border: rgba(0, 0, 0, 0.07);
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 12px 14px 40px; transition: background 0.2s, color 0.2s; }
    .wrap { max-width: 640px; margin: 0 auto; }

    /* Верхня панель */
    .header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 7px 14px; border-radius: 99px; font-size: 13px; font-weight: 600;
      white-space: nowrap; cursor: pointer; transition: 0.18s;
    }
    .tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    .theme-btn {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0;
    }

    /* Картки */
    .card {
      background: var(--card); border-radius: 18px; padding: 16px;
      margin-bottom: 12px; border: 1px solid var(--border); box-shadow: var(--shadow);
    }

    .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }

    /* Статистика */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat { background: var(--bg); padding: 10px 8px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
    .stat b { display: block; font-size: 18px; font-weight: 700; }
    .stat span { font-size: 11px; color: var(--muted); font-weight: 500; }

    /* Селектори */
    .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .pill-btn {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center; transition: 0.15s;
    }
    .pill-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    .count-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .count-input {
      width: 76px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 9px; font-size: 14px; font-weight: 700; text-align: center;
    }
    .mini-btn {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      padding: 9px 13px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    .btn-main {
      width: 100%; background: var(--accent); color: var(--accent-text); border: none;
      padding: 13px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-sub {
      width: 100%; background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 11px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }

    /* Закріплена панель у режимі стрічки */
    .sticky-bar {
      position: sticky; top: 8px; z-index: 20;
      background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow);
      border-radius: 14px; padding: 10px 14px; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; color: var(--accent); }
    .counter { font-size: 13px; font-weight: 600; color: var(--muted); }

    /* Картка питання у стрічці */
    .q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .q-num { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; }
    .q-title { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 12px; white-space: pre-line; }
    .star-icon { font-size: 20px; cursor: pointer; color: var(--muted); line-height: 1; user-select: none; }
    .star-icon.on { color: var(--star); }

    .opts { display: flex; flex-direction: column; gap: 8px; }
    .opt {
      width: 100%; text-align: left; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); padding: 11px 13px; border-radius: 11px;
      font-size: 13.5px; line-height: 1.35; cursor: pointer; transition: 0.12s;
    }
    .opt.exam-picked { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .opt.correct { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 600; }
    .opt.wrong { border-color: var(--err); background: var(--err-soft); color: var(--err); }

    /* Список усіх питань */
    .db-item { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
    .db-item:last-child { border-bottom: none; }
    .db-ans { color: var(--ok); font-size: 12.5px; font-weight: 600; margin-top: 4px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="tabs" id="tabs"></div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Змінити тему">☀️</button>
  </div>

  <!-- ЕКРАН 1: НАЛАШТУВАННЯ -->
  <div id="setupView">
    <div class="card">
      <div class="title-row">
        <h1 id="subjTitle">Медична фізика</h1>
      </div>

      <div class="stats">
        <div class="stat"><b id="sTotal">0</b><span>Усього</span></div>
        <div class="stat"><b id="sErr" style="color:var(--err)">0</b><span>Помилки</span></div>
        <div class="stat"><b id="sStar" style="color:var(--star)">0</b><span>Обране ★</span></div>
      </div>

      <div class="label">Питання</div>
      <div class="grid-2">
        <button class="pill-btn active" data-pool="all" onclick="setPool('all', this)">Усі підряд</button>
        <button class="pill-btn" data-pool="shuffle" onclick="setPool('shuffle', this)">Упереміш</button>
        <button class="pill-btn" data-pool="errors" onclick="setPool('errors', this)">Помилки</button>
        <button class="pill-btn" data-pool="starred" onclick="setPool('starred', this)">Обране ★</button>
      </div>

      <div class="label">Режим</div>
      <div class="grid-2">
        <button class="pill-btn active" data-mode="learn" onclick="setMode('learn', this)">Навчання</button>
        <button class="pill-btn" data-mode="exam" onclick="setMode('exam', this)">Контроль</button>
      </div>

      <div class="label">Кількість</div>
      <div class="count-row">
        <input type="number" id="countInput" class="count-input" min="1" value="16" />
        <button class="mini-btn" onclick="setCount(10)">10</button>
        <button class="mini-btn" onclick="setCount(25)">25</button>
        <button class="mini-btn" onclick="setAllCount()">Усі</button>
      </div>

      <button class="btn-main" onclick="startFeed()">Почати</button>
      <button class="btn-sub" onclick="toggleDbList()">Усі питання та відповіді</button>
    </div>

    <div class="card hidden" id="dbListCard">
      <div id="dbList"></div>
    </div>
  </div>

  <!-- ЕКРАН 2: СТРІЧКА ПИТАНЬ -->
  <div id="feedView" class="hidden">
    <div class="sticky-bar">
      <button class="mini-btn" style="padding:5px 10px" onclick="goHome()">← Назад</button>
      <div class="counter" id="answeredCount">0 / 16</div>
      <div class="timer" id="timerBox">00:00</div>
    </div>

    <div id="feedContainer"></div>

    <button class="btn-main" onclick="finishFeed()">Завершити</button>
  </div>

  <!-- ЕКРАН 3: РЕЗУЛЬТАТ -->
  <div id="resultView" class="hidden">
    <div class="card">
      <h1 style="margin-bottom:6px">Результат</h1>
      <div id="resSummary" style="color:var(--muted); font-size:14px; margin-bottom:14px"></div>
      <div id="resList"></div>
      <button class="btn-main" style="margin-top:12px" onclick="goHome()">На головну</button>
    </div>
  </div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // === БАЗА ПИТАНЬ (Сюди вставляємо нові порції) ===
  const QUIZ_DB = {
    "Медична фізика": [
      { id: "mf_1", q: "За якою формулою визначають коефіцієнт поляризації К?", opts: ["K = ZА/Zв", "K = Zн/Zв", "K = ZВ/ZА", "K = Zв/Zн", "K = Zн/ZА"], correct: 1 },
      { id: "mf_2", q: "Реограма – …, яка відповідає залежності … від часу:\n1) крива; 2) пряма; 3) гіпербола\nА) повного опору; Б) сили струму; В) напруги; Г) індуктивності", opts: ["3-Г", "2-Б", "1-А", "1-Б", "2-В"], correct: 2 },
      { id: "mf_3", q: "Загальний опір кола змінного струму – це імпеданс", opts: ["ні", "так"], correct: 1 },
      { id: "mf_4", q: "Вкажіть методи вимірювання електропровідності:\n1) містковий; 2) Ребіндера; 3) імпульсний; 4) імпедансний; 5) детекторний.", opts: ["1), 3)", "1), 3), 5)", "1), 2), 5)", "2), 3), 5)", "4), 5)"], correct: 1 },
      { id: "mf_5", q: "Реактивний опір тканини має розмірність:", opts: ["Ом/А", "Дж/Кл.", "1Вт/А", "Ом", "(Вт/В)*(А/Вт)"], correct: 3 },
      { id: "mf_6", q: "Під час систоли кров заповнює органи (тканини), тому імпеданс:", opts: ["залишається незмінним", "зменшується до безкінечності", "збільшується", "збільшується до безкінечності", "зменшується"], correct: 4 },
      { id: "mf_7", q: "Загальний опір кола змінного струму – це омічний опір", opts: ["так", "ні"], correct: 1 },
      { id: "mf_8", q: "Що називають коефіцієнтом поляризації?", opts: ["відношення активного опору до реактивного;", "відношення імпедансу на високій частоті до імпедансу на низькій частоті;", "залежність показника заломлення від інтенсивності електромагнітної хвилі.", "залежність імпедансу від частоти;", "відношення імпедансу на низькій частоті до імпедансу на високій частоті;"], correct: 4 },
      { id: "mf_9", q: "Крутизна фронту для імпульсів близьких до прямокутних визначається як:\n1. Imax; 2. Imax/2^(1/2); 3. 0,8·Imax; 4. поділити на; 5. помножити; 6. період Т; 7. тривалість імпульсу t імп.", opts: ["1,4,7", "3,4,6", "2,5,6", "2,5,6 (варіант 2)", "3,4,7"], correct: 4 },
      { id: "mf_10", q: "Загальна тривалість імпульсу, що дорівнює по амплітуді подвоєній реобазі, називається:", opts: ["хронаксією", "реобазою", "часом релаксації", "акомодацією", "лабільністю"], correct: 0 },
      { id: "mf_11", q: "Одним з параметрів імпульсного струму є коефіцієнт заповнення.", opts: ["так", "ні"], correct: 0 },
      { id: "mf_12", q: "Властивість збудливих тканин відповідати на подразнення тільки в певних межах частоти повторення імпульсів називається:", opts: ["хронаксією", "реобазою", "акомодацією", "лабільністю", "електрозбудливістю"], correct: 3 },
      { id: "mf_13", q: "Установіть відповідності:\n1) властивості тканин; 2) показники функціонального стану тканин; 3) основні параметри імпульсу\nА) крутизна фронту; Б) реобаза; В) лабільність; Г) амплітуда; Д) акомодація; Е) тривалість; Ж) хронаксія", opts: ["1 Ж,Д; 2 Б,В; 3 А,Г", "1 А,Д; 2 Б,Е; 3 В,Г,Ж", "1 В,Д; 2 Б,А; 3 А,Е", "1 В,Д; 2 Б,Ж; 3 А,Г,Е", "1 В,Г; 2 Б,Ж; 3 А,Д,Е"], correct: 3 },
      { id: "mf_14", q: "Подразнювальна дія імпульсного струму низької частоти залежить від амплітуди, частоти і форми імпульсу, конфігурації його переднього і заднього фронтів, тривалості імпульсів", opts: ["так", "ні"], correct: 0 },
      { id: "mf_15", q: "При зупинці роботи серця чи вирівнюванні фазового скорочення міокарда застосовують імпульси з такими параметрами:", opts: ["Напруга до 220 В і сила струму до 20 мА", "Напруга до 380 В і сила струму до 1 А", "Напруга до 8 кВ і сила струму до 2 А", "Напруга до 8 кВ і сила струму до 100 мА", "Напруга до 380 В і сила струму до 100 мА"], correct: 2 },
      { id: "mf_16", q: "Закон електрозбудливості називають законом:", opts: ["Дюлонга - Пті", "Дюбуа-Реймона", "Герцшпрунга - Рассела", "Вебера – Фехнера", "Вейса – Лапіка"], correct: 4 }
    ]
  };

  // Стан
  let errors = new Set(JSON.parse(localStorage.getItem("q_err") || "[]"));
  let starred = new Set(JSON.parse(localStorage.getItem("q_star") || "[]"));
  let isLight = localStorage.getItem("q_theme") === "light";

  let subject = Object.keys(QUIZ_DB)[0];
  let poolMode = "all";
  let runMode = "learn";
  let feedItems = [];
  let answers = {};
  let sec = 0;
  let timer = null;

  function applyTheme() {
    document.body.classList.toggle("light", isLight);
    document.getElementById("themeBtn").textContent = isLight ? "🌙" : "☀️";
  }

  function toggleTheme() {
    isLight = !isLight;
    localStorage.setItem("q_theme", isLight ? "light" : "dark");
    applyTheme();
  }

  function save() {
    localStorage.setItem("q_err", JSON.stringify([...errors]));
    localStorage.setItem("q_star", JSON.stringify([...starred]));
  }

  function renderTabs() {
    const el = document.getElementById("tabs");
    el.innerHTML = Object.keys(QUIZ_DB).map(s =>
      `<button class="tab ${s === subject ? 'active' : ''}" onclick="pickSubject('${s}')">${s}</button>`
    ).join("");
  }

  function pickSubject(s) {
    subject = s;
    renderTabs();
    refreshSetup();
  }

  function refreshSetup() {
    const list = QUIZ_DB[subject] || [];
    document.getElementById("subjTitle").textContent = subject;
    document.getElementById("sTotal").textContent = list.length;
    document.getElementById("sErr").textContent = list.filter(x => errors.has(x.id)).length;
    document.getElementById("sStar").textContent = list.filter(x => starred.has(x.id)).length;
    document.getElementById("countInput").value = list.length;
    renderDbList();
  }

  function setPool(p, btn) {
    poolMode = p;
    document.querySelectorAll("[data-pool]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  function setMode(m, btn) {
    runMode = m;
    document.querySelectorAll("[data-mode]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  function setCount(n) { document.getElementById("countInput").value = n; }
  function setAllCount() { document.getElementById("countInput").value = (QUIZ_DB[subject] || []).length; }
  function toggleDbList() { document.getElementById("dbListCard").classList.toggle("hidden"); }

  function renderDbList() {
    const list = QUIZ_DB[subject] || [];
    document.getElementById("dbList").innerHTML = list.map((item, i) => `
      <div class="db-item">
        <div style="display:flex; justify-content:space-between; gap:8px;">
          <span><b>${i + 1}.</b> ${item.q}</span>
          <span class="star-icon ${starred.has(item.id) ? 'on' : ''}" onclick="toggleStar('${item.id}', true)">${starred.has(item.id) ? '★' : '☆'}</span>
        </div>
        <div class="db-ans">✓ ${item.opts[item.correct]}</div>
      </div>
    `).join("");
  }

  function toggleStar(id, fromSetup = false) {
    if (starred.has(id)) starred.delete(id);
    else starred.add(id);
    save();
    if (fromSetup) refreshSetup();
    else {
      const icon = document.getElementById("star_" + id);
      if (icon) {
        icon.classList.toggle("on", starred.has(id));
        icon.textContent = starred.has(id) ? "★" : "☆";
      }
    }
  }

  function startFeed() {
    let list = [...(QUIZ_DB[subject] || [])];
    if (poolMode === "errors") list = list.filter(x => errors.has(x.id));
    if (poolMode === "starred") list = list.filter(x => starred.has(x.id));
    if (poolMode !== "all") list.sort(() => Math.random() - 0.5);

    if (!list.length) {
      alert("Тут поки порожньо");
      return;
    }

    const limit = Math.max(1, Math.min(list.length, parseInt(document.getElementById("countInput").value) || list.length));
    feedItems = list.slice(0, limit);
    answers = {};

    document.getElementById("setupView").classList.add("hidden");
    document.getElementById("resultView").classList.add("hidden");
    document.getElementById("feedView").classList.remove("hidden");

    updateCounter();
    renderFeedCards();
    startTimer();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderFeedCards() {
    const container = document.getElementById("feedContainer");
    container.innerHTML = feedItems.map((item, idx) => `
      <div class="card" id="card_${item.id}">
        <div class="q-head">
          <span class="q-num">Питання ${idx + 1}</span>
          <span class="star-icon ${starred.has(item.id) ? 'on' : ''}" id="star_${item.id}" onclick="toggleStar('${item.id}')">${starred.has(item.id) ? '★' : '☆'}</span>
        </div>
        <div class="q-title">${item.q}</div>
        <div class="opts" id="opts_${item.id}">
          ${item.opts.map((opt, oIdx) => `
            <button class="opt" onclick="pickOpt('${item.id}', ${oIdx})">${opt}</button>
          `).join("")}
        </div>
      </div>
    `).join("");
  }

  function pickOpt(id, chosenIdx) {
    const item = feedItems.find(x => x.id === id);
    if (!item) return;
    if (runMode === "learn" && answers[id] !== undefined) return;

    answers[id] = chosenIdx;
    updateCounter();

    const btns = document.querySelectorAll(`#opts_${id} .opt`);
    btns.forEach((btn, idx) => {
      btn.classList.remove("exam-picked", "correct", "wrong");
      if (runMode === "learn") {
        if (idx === item.correct) btn.classList.add("correct");
        else if (idx === chosenIdx) btn.classList.add("wrong");
      } else {
        if (idx === chosenIdx) btn.classList.add("exam-picked");
      }
    });

    if (runMode === "learn") {
      if (chosenIdx === item.correct) errors.delete(id);
      else errors.add(id);
      save();
    }
  }

  function updateCounter() {
    document.getElementById("answeredCount").textContent = `${Object.keys(answers).length} / ${feedItems.length}`;
  }

  function startTimer() {
    clearInterval(timer);
    sec = 0;
    tick();
    timer = setInterval(() => { sec++; tick(); }, 1000);
  }

  function tick() {
